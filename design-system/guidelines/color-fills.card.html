<!-- @dsCard group="Colors" viewport="700x150" name="Status fills" subtitle="10% fill + 50% border — the standard tinted surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="padding:14px;border-radius:var(--radius-lg);background:var(--fill-normal);border:1px solid var(--border-normal)"><div style="font-size:13px;font-weight:500;color:var(--status-normal)">Normal</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">fill 10% / border 50%</div></div><div style="padding:14px;border-radius:var(--radius-lg);background:var(--fill-warning);border:1px solid var(--border-warning)"><div style="font-size:13px;font-weight:500;color:var(--status-warning)">Warning</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">fill 10% / border 50%</div></div><div style="padding:14px;border-radius:var(--radius-lg);background:var(--fill-critical);border:1px solid var(--border-critical)"><div style="font-size:13px;font-weight:500;color:var(--status-critical)">Critical</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">fill 10% / border 50%</div></div><div style="padding:14px;border-radius:var(--radius-lg);background:var(--fill-accent);border:1px solid rgba(124,58,237,.5)"><div style="font-size:13px;font-weight:500;color:var(--accent-primary)">Accent</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">fill 10% / border 50%</div></div></div></body></html>
