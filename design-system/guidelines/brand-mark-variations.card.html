<!-- @dsCard group="Brand" viewport="700x420" name="Mark variations" subtitle="Six treatments of the shield-and-crescent, each shown at 44px and 18px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cell{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-card)}
.marks{display:flex;align-items:flex-end;gap:14px;min-height:52px}
.n{font-size:12px;font-weight:500}.d{font-size:11px;color:var(--text-muted);line-height:1.5}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="grid" id="g"></div>
<script>
var P="#5B21B6",PL="#7C3AED",Y="#FACC15",BG="#071122";
var shieldClassic='<path d="M24 2.6 44.4 11.2v18.4c0 13.1-9 21.7-20.4 25.4C12.6 51.3 3.6 42.7 3.6 29.6V11.2z" stroke="'+PL+'" stroke-width="3.4" stroke-linejoin="round" fill="none"/>';
var shieldSolid='<path d="M24 2.6 44.4 11.2v18.4c0 13.1-9 21.7-20.4 25.4C12.6 51.3 3.6 42.7 3.6 29.6V11.2z" fill="'+P+'"/>';
var shieldSoft='<path d="M8.5 11.4a4 4 0 0 1 2.9-3.8L24 3.4l12.6 4.2a4 4 0 0 1 2.9 3.8v17.4c0 12.6-7.8 20.5-15.5 24.4-7.7-3.9-15.5-11.8-15.5-24.4z" stroke="'+PL+'" stroke-width="3.4" stroke-linejoin="round" fill="none"/>';
var shieldCrest='<path d="M24 3c0 0 13.5 4.8 20 8.2 0 19.6-8 33.4-20 41.6C12 44.6 4 30.8 4 11.2 10.5 7.8 24 3 24 3z" stroke="'+PL+'" stroke-width="3.4" stroke-linejoin="round" fill="none"/>';
var moonFill='<path d="M27.6 17.6a10 10 0 1 0 0 20 12.6 12.6 0 0 1 0-20z" fill="'+Y+'"/>';
var moonKnock='<path d="M27.6 17.6a10 10 0 1 0 0 20 12.6 12.6 0 0 1 0-20z" fill="'+BG+'"/>';
var moonLow='<path d="M28.5 21.5a10.5 10.5 0 1 0 0 21 13.2 13.2 0 0 1 0-21z" fill="'+Y+'"/>';
var moonLine='<path d="M28 18.4a10 10 0 1 0 0 20 12.6 12.6 0 0 1 0-20z" stroke="'+Y+'" stroke-width="3" stroke-linejoin="round" fill="none"/>';
var V=[
 ["1 · Classic","Outline shield, filled crescent. Current mark.",shieldClassic+moonFill],
 ["2 · Knockout","Solid purple shield, crescent cut out of it.",shieldSolid+moonKnock],
 ["3 · Cradled","Crescent dropped low so the shield cups it.",shieldClassic+moonLow],
 ["4 · Monoline","Both forms as strokes — lightest weight.",shieldClassic+moonLine],
 ["5 · Soft shield","Rounded shoulders. Warmer, less martial.",shieldSoft+moonFill],
 ["6 · Crest","Curved flanks, deeper point. More heraldic.",shieldCrest+moonFill]
];
document.getElementById("g").innerHTML=V.map(function(v){
 return '<div class="cell"><div class="marks"><svg viewBox="0 0 48 56" height="44" fill="none">'+v[2]+'</svg><svg viewBox="0 0 48 56" height="18" fill="none">'+v[2]+'</svg><span class="k">44 / 18px</span></div><div><div class="n">'+v[0]+'</div><div class="d">'+v[1]+'</div></div></div>';
}).join("");
</script></body></html>
