<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Normal, warning, critical, offline, simulated" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div><div style="height:56px;border-radius:var(--radius-lg);background:var(--status-normal);border:1px solid rgba(255,255,255,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:500">normal</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">#16A34A</div></div><div><div style="height:56px;border-radius:var(--radius-lg);background:var(--status-warning);border:1px solid rgba(255,255,255,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:500">warning</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">#FACC15</div></div><div><div style="height:56px;border-radius:var(--radius-lg);background:var(--status-critical);border:1px solid rgba(255,255,255,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:500">critical</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">#EF4444</div></div><div><div style="height:56px;border-radius:var(--radius-lg);background:var(--status-offline);border:1px solid rgba(255,255,255,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:500">offline</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">#94A3B8</div></div><div><div style="height:56px;border-radius:var(--radius-lg);background:var(--status-simulated);border:1px solid rgba(255,255,255,.08)"></div><div style="margin-top:8px;font-size:12px;font-weight:500">simulated</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">#22D3EE</div></div></div></body></html>
