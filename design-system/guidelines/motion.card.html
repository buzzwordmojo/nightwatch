<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Breathe, pulse-ring, pulse-slow, pulse-fast — all cubic-bezier(.4,0,.2,1)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:24px;align-items:center">
<div style="text-align:center"><div style="width:44px;height:44px;border-radius:50%;background:var(--status-normal);animation:kw-pulse-ring 2s var(--ease-standard) infinite;margin:0 auto"></div><div style="font-size:11px;color:var(--text-muted);margin-top:10px">pulse-ring 2s<br>healthy dot</div></div>
<div style="text-align:center"><div style="width:44px;height:44px;border-radius:var(--radius-lg);background:var(--fill-warning);border:1px solid var(--border-warning);animation:kw-pulse-slow 2s var(--ease-standard) infinite;margin:0 auto"></div><div style="font-size:11px;color:var(--text-muted);margin-top:10px">pulse-slow 2s<br>warning card</div></div>
<div style="text-align:center"><div style="width:44px;height:44px;border-radius:var(--radius-lg);background:var(--fill-critical);border:1px solid var(--border-critical);animation:kw-pulse-fast .75s var(--ease-standard) infinite;margin:0 auto"></div><div style="font-size:11px;color:var(--text-muted);margin-top:10px">pulse-fast .75s<br>critical card</div></div>
<div style="text-align:center"><div style="width:44px;height:44px;border-radius:50%;border:1px solid var(--border-normal);animation:kw-breathing-glow 4s var(--ease-standard) infinite;margin:0 auto"></div><div style="font-size:11px;color:var(--text-muted);margin-top:10px">breathing-glow 4s<br>all-clear state</div></div></div></body></html>
